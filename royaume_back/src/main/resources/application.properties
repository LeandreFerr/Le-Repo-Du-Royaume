# ===================================================================
# Configuration de l'Application Royaume Back (Spring Boot)
# ===================================================================
spring.application.name=royaume-back

# Import optionnel d'un fichier personnel (ex: application-local.properties, ignoré par Git)
spring.config.import=optional:classpath:application-local.properties

# Port du serveur (8080 par défaut, personnalisable via variable d'environnement ou argument --server.port=8090)
server.port=${SERVER_PORT:8080}

# ===================================================================
# Connexion Base de Données (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/royaume?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Configuration JPA & Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
