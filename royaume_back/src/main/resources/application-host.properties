# Profil "host" : 1 seule instance par partie — moteur de jeu et initialisation actifs
royaume.scheduling.enabled=true
royaume.init.enabled=true

# 'update' par defaut pour preserver une partie en cours si le Host redemarre.
# Passer HOST_DDL_AUTO=create uniquement pour repartir d'une base vierge.
spring.jpa.hibernate.ddl-auto=${HOST_DDL_AUTO:update}
spring.jpa.show-sql=false
