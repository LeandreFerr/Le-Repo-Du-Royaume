name: royaume-clean

services:
  db:
    image: mysql:8.4.13
    container_name: royaume-clean-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: royaume_clean

    volumes:
      - db-data:/var/lib/mysql

    networks:
      - royaume-clean

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      timeout: 3s
      retries: 15
      interval: 5s

  pma:
    image: phpmyadmin
    container_name: royaume-clean-pma

    environment:
      PMA_HOST: db

    ports:
      - 8082:80

    networks:
      - royaume-clean

    depends_on:
      db:
        condition: service_healthy

  java:
    image: royaume:back
    build: ./royaume_back
    container_name: royaume-clean-back

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/royaume_clean?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 8080

    ports:
      - 8091:8080

    networks:
      - royaume-clean

    depends_on:
      db:
        condition: service_healthy

  angular:
    image: royaume:front
    build: ./royaume_front
    container_name: royaume-clean-front

    ports:
      - 82:80

    networks:
      - royaume-clean

    depends_on:
      - java
      - pma

networks:
  royaume-clean:
    name: royaume-clean

volumes:
  db-data:
    name: royaume-clean-db-data
